<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MIN AI Movie Recap</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0d10;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 35px 18px;
}

.logo {
  text-align: center;
  font-size: 44px;
  font-weight: 800;
  letter-spacing: 2px;
}

.subtitle {
  text-align: center;
  color: #999;
  margin-top: 8px;
  margin-bottom: 30px;
}

.card {
  background: #171a20;
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 20px;
}

h2 {
  margin-top: 0;
}

.upload {
  width: 100%;
  padding: 18px;
  border: 1px dashed #666;
  border-radius: 12px;
  color: white;
  margin: 15px 0;
}

video {
  width: 100%;
  border-radius: 14px;
  margin-top: 15px;
  display: none;
}

.info {
  color: #aaa;
  font-size: 14px;
  line-height: 1.7;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 8px;
}

select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 25px;
  border: none;
  border-radius: 12px;
  background: white;
  color: black;
  font-size: 16px;
  font-weight: bold;
}

#status {
  text-align: center;
  color: #aaa;
  margin-top: 18px;
}

.footer {
  text-align: center;
  color: #666;
  font-size: 13px;
  margin-top: 30px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">MIN AI</div>

  <div class="subtitle">
    Movie Recap Studio
  </div>

  <div class="card">

    <h2>🎬 Movie Recap</h2>

    <input
      id="movieFile"
      class="upload"
      type="file"
      accept="video/*"
    >

    <video id="videoPreview" controls></video>

    <div id="fileInfo" class="info"></div>

  </div>

  <div class="card">

    <h2>⚙️ Recap Settings</h2>

    <label>Language</label>

    <select>
      <option>Myanmar 🇲🇲</option>
      <option>English 🇺🇸</option>
    </select>

    <label>Voice</label>

    <select>
      <option>My Voice 🎙️</option>
      <option>AI Voice</option>
    </select>

    <button onclick="generateRecap()">
      Generate Recap
    </button>

    <p id="status"></p>

  </div>

  <div class="footer">
    MIN AI Movie Recap © 2026
  </div>

</div>

<script>

const movieFile = document.getElementById("movieFile");
const videoPreview = document.getElementById("videoPreview");
const fileInfo = document.getElementById("fileInfo");

movieFile.addEventListener("change", function() {

  const file = this.files[0];

  if (!file) return;

  videoPreview.src = URL.createObjectURL(file);
  videoPreview.style.display = "block";

  const size = (file.size / 1024 / 1024).toFixed(2);

  fileInfo.innerHTML =
    "File: " + file.name +
    "<br>Size: " + size + " MB";

});

function generateRecap() {

  if (!movieFile.files[0]) {

    document.getElementById("status").innerText =
      "Please upload a movie first.";

    return;
  }

  document.getElementById("status").innerText =
    "MIN AI is preparing your movie recap...";

}

</script>

</body>
</html>
