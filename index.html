<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIN AI Movie Recap</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b0d10;
  color:white;
  font-family:Arial,sans-serif
}

.container{
  max-width:650px;
  margin:auto;
  padding:35px 18px
}

.logo{
  text-align:center;
  font-size:44px;
  font-weight:800;
  letter-spacing:2px
}

.subtitle{
  text-align:center;
  color:#999;
  margin:8px 0 30px
}

.card{
  background:#171a20;
  border-radius:20px;
  padding:24px;
  margin-bottom:20px
}

h2{
  margin-top:0
}

textarea{
  width:100%;
  min-height:180px;
  padding:15px;
  border-radius:12px;
  border:1px solid #333;
  background:#0d0f13;
  color:white;
  font-size:15px;
  resize:vertical
}

select{
  width:100%;
  padding:14px;
  margin-top:8px;
  border-radius:10px;
  border:none
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:8px
}

button{
  width:100%;
  padding:16px;
  margin-top:20px;
  border:none;
  border-radius:12px;
  background:white;
  color:black;
  font-size:16px;
  font-weight:bold
}

.output{
  margin-top:20px;
  padding:18px;
  background:#0d0f13;
  border-radius:12px;
  line-height:1.8;
  white-space:pre-wrap;
  color:#ddd
}

.footer{
  text-align:center;
  color:#666;
  font-size:13px;
  margin-top:30px
}
</style>
</head>

<body>

<div class="container">

<div class="logo">MIN AI</div>

<div class="subtitle">
Movie Recap Studio
</div>

<div class="card">

<h2>📝 Movie Story</h2>

<textarea
id="story"
placeholder="ဒီနေရာမှာ Movie ဇာတ်လမ်း / Transcript ကို ထည့်ပါ...">
</textarea>

<label>Language</label>

<select id="language">
<option>Myanmar 🇲🇲</option>
<option>English 🇺🇸</option>
</select>

<label>Voice</label>

<select id="voice">
<option>My Voice 🎙️</option>
<option>AI Voice</option>
</select>

<button onclick="generateRecap()">
🤖 Generate Myanmar Recap
</button>

</div>

<div class="card">

<h2>🎬 Recap Result</h2>

<div id="result" class="output">
Your Myanmar movie recap will appear here.
</div>

</div>

<div class="footer">
MIN AI Movie Recap © 2026
</div>

</div>

<script>

function generateRecap(){

const story=document.getElementById("story").value.trim();

const result=document.getElementById("result");

if(!story){

result.innerText=
"ကျေးဇူးပြုပြီး Movie ဇာတ်လမ်းကို အရင်ထည့်ပါ။";

return;

}

result.innerText=
"MIN AI က Movie Recap Script ပြင်ဆင်နေပါတယ်...\n\n"+
"ဒီအဆင့်မှာ AI API မချိတ်ရသေးပါဘူး။ "+
"နောက်တစ်ဆင့်မှာ AI ကို ချိတ်ပြီး မြန်မာ Recap Script အမှန်တကယ် ထုတ်ပေးနိုင်အောင် ပြုလုပ်ပါမယ်။";

}

</script>

</body>
</html>
